name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,interpretability]'
      - name: Lint
        run: ruff check .
      - name: Type check
        if: matrix.python-version == '3.11'
        run: mypy src
      - name: Verify schemas
        run: |
          python scripts/generate_schemas.py
          git diff --exit-code -- schemas
          test -z "$(git status --porcelain --untracked-files=all -- schemas)"
      - name: Test
        run: pytest
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
