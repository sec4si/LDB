name: GPU smoke

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Serving runtime
        required: true
        type: choice
        options:
          - vllm
          - sglang
      model:
        description: Hugging Face model ID available to the runner
        required: true
        default: facebook/opt-125m
        type: string
      runtime_version:
        description: Exact vLLM or SGLang package version
        required: true
        type: string
      mode:
        description: Execution mode
        required: true
        default: eager
        type: choice
        options:
          - eager
          - graph

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install LDB
        run: python -m pip install '.[transformers]'
      - name: Install vLLM
        if: inputs.backend == 'vllm'
        env:
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: python -m pip install "vllm==${RUNTIME_VERSION}"
      - name: Install SGLang
        if: inputs.backend == 'sglang'
        env:
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: python -m pip install "sglang[all]==${RUNTIME_VERSION}"
      - name: Run smoke test
        env:
          BACKEND: ${{ inputs.backend }}
          MODEL_ID: ${{ inputs.model }}
          MODE: ${{ inputs.mode }}
        run: python scripts/gpu_smoke.py "$BACKEND" "$MODEL_ID" --mode "$MODE" --artifacts gpu-smoke-artifacts
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-smoke-${{ inputs.backend }}-${{ inputs.runtime_version }}-${{ inputs.mode }}
          path: gpu-smoke-artifacts/
          if-no-files-found: error
