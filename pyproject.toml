[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "latent-debugger"
version = "0.1.0.dev0"
description = "A runtime debugger and neural patching framework for large language models."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "prompt-toolkit>=3.0.52,<4",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
  "rich>=14,<15",
  "safetensors>=0.6,<1",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
transformers = [
  "torch>=2.6",
  "transformers>=5.9,<6",
]
dev = [
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
ldb = "ldb.cli:app"

[project.entry-points."sglang.srt.plugins"]
ldb = "ldb.adapters.sglang:register_plugin"

[project.entry-points."vllm.general_plugins"]
ldb = "ldb.adapters.vllm:register_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/ldb"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ldb"]
